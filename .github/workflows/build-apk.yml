name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache SDK/NDK buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: buildozer-v3-ndk25b

      - name: Install dependensi sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config zlib1g-dev libffi-dev \
            libssl-dev cmake ccache libncurses5-dev libncursesw5-dev libtinfo5

      - name: Install buildozer
        run: |
          python -m pip install -U pip
          python -m pip install -U buildozer Cython==0.29.33

      - name: Build APK
        run: buildozer -v android debug
        env:
          USE_CCACHE: '1'
          BUILDOZER_WARN_ON_ROOT: '0'

      - name: Kumpulkan APK
        run: |
          mkdir -p dist
          cp "$(ls bin/*.apk | head -n 1)" dist/FlappyNeon.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flappy-apk
          path: dist/FlappyNeon.apk
